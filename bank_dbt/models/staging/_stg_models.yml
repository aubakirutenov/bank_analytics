version: 2

models:
  - name: stg_account
    description: One row per bank account, with the opening date as a real date.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: district_id
        data_tests: [not_null]
      - name: frequency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['POPLATEK MESICNE', 'POPLATEK TYDNE', 'POPLATEK PO OBRATU']
      - name: opened_date
        data_tests: [not_null]
  - name: stg_trans
    description: One row per transaction; empty codes cleaned to NULL, dates as real dates.
    columns:
      - name: trans_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_account')
                field: account_id
      - name: type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PRIJEM', 'VYDAJ', 'VYBER']
      - name: trans_date
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]  
  - name: stg_loan
    description: One row per loan; at most one loan per account.
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_account')
                field: account_id
      - name: granted_date
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']  
  - name: stg_client
    columns:
      - name: client_id
        data_tests:
          - unique
          - not_null
      - name: district_id
        data_tests:
          - not_null
      - name: gender
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'M']
      - name: birth_date
        data_tests:
          - not_null  