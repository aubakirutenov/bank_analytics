version: 2

models:
  - name: stg_account
    description: One row per bank account, with the opening date as a real date.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: district_id
        data_tests: [not_null]
      - name: frequency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['POPLATEK MESICNE', 'POPLATEK TYDNE', 'POPLATEK PO OBRATU']
      - name: opened_date
        data_tests: [not_null]